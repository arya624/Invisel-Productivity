<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invisel Task Tracker — Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7F8;
  --surface:#FFFFFF;
  --surface-alt:#F0F3F4;
  --border:#E2E6E8;
  --ink:#12181F;
  --ink-soft:#5B6472;
  --ink-faint:#8A93A0;
  --accent:#0E7C86;
  --accent-dark:#0B646C;
  --accent-soft:#E4F2F1;
  --high:#B5432E;
  --high-soft:#FBEAE6;
  --medium:#B0791F;
  --medium-soft:#FBF1DF;
  --low:#2F6FA8;
  --low-soft:#E7F0F8;
  --success:#2C8F5B;
  --success-soft:#E5F5EB;
  --blocked:#9C3B3B;
  --blocked-soft:#F6E8E8;
  --neutral:#6B7280;
  --neutral-soft:#EEF0F2;
  --radius:12px;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
}
button, select, input, textarea{ font-family:inherit; font-size:inherit; color:inherit; }
button{ cursor:pointer; }
a{ color:inherit; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

.topbar{ background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10; }
.sheen{ height:3px; background:linear-gradient(90deg, var(--accent), #cfe9e6 45%, var(--accent) 90%); background-size:200% 100%; animation:sheen-move 7s linear infinite; }
@media (prefers-reduced-motion: reduce){ .sheen{ animation:none; } }
@keyframes sheen-move{ 0%{background-position:0% 0;} 100%{background-position:200% 0;} }

.topbar-inner{ max-width:1180px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.brand{ display:flex; align-items:center; gap:10px; }
.brand-mark{ width:14px; height:14px; border-radius:50% 50% 50% 4px; background:var(--accent); display:inline-block; transform:rotate(-45deg); flex-shrink:0; }
.brand-name{ font-family:var(--font-display); font-weight:700; font-size:18px; letter-spacing:0.01em; line-height:1.1; }
.brand-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:1px; }

.topbar-right{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }

.role-switch{ display:flex; background:var(--surface-alt); border:1px solid var(--border); border-radius:999px; padding:3px; gap:2px; }
.role-tab{ border:none; background:transparent; padding:8px 16px; border-radius:999px; font-weight:600; font-size:13.5px; color:var(--ink-soft); transition:background .15s ease, color .15s ease; text-decoration:none; display:inline-flex; align-items:center; }
.role-tab[aria-selected="true"]{ background:var(--ink); color:#fff; }
.role-tab:hover:not([aria-selected="true"]){ color:var(--ink); }

.sync-status{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--ink-faint); }
.dot-status{ width:7px; height:7px; border-radius:50%; background:var(--ink-faint); display:inline-block; flex-shrink:0; }
.dot-status.dot-ok{ background:var(--success); }
.dot-status.dot-warn{ background:var(--medium); }
.dot-status.dot-off{ background:var(--high); }

main{ max-width:1180px; margin:0 auto; padding:24px 20px 80px; }

.banner{ border:1px solid #f0dfb8; background:var(--medium-soft); color:var(--medium); border-radius:10px; padding:11px 14px; font-size:13px; margin-bottom:20px; line-height:1.5; }
.banner.banner-error{ border-color:#f0c9c0; background:var(--high-soft); color:var(--high); }
.banner code{ background:rgba(0,0,0,0.06); padding:1px 5px; border-radius:4px; font-family:var(--font-mono); font-size:12px; }

.section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:32px 0 14px; flex-wrap:wrap; }
.section-head:first-child{ margin-top:0; }
.section-title{ font-family:var(--font-display); font-weight:700; font-size:16px; margin:0; }
.section-hint{ font-size:12.5px; color:var(--ink-faint); }

.stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
.stat-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; }
.stat-value{ font-family:var(--font-mono); font-weight:600; font-size:26px; line-height:1; }
.stat-label{ font-size:12.5px; color:var(--ink-soft); margin-top:8px; }
.stat-card.warn .stat-value{ color:var(--high); }
.stat-card.ok .stat-value{ color:var(--success); }

.panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; }
.panel + .panel{ margin-top:14px; }
.panel h3{ margin:0 0 12px; font-size:13px; color:var(--ink-soft); font-weight:600; }

.filter-bar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
.filter-bar select{ background:var(--surface-alt); border:1px solid var(--border); border-radius:8px; padding:7px 10px; font-size:13px; }
.btn{ border:1px solid var(--border); background:var(--surface); padding:8px 14px; border-radius:8px; font-weight:600; font-size:13px; transition:border-color .15s ease, background .15s ease; }
.btn:hover{ border-color:var(--ink-faint); }
.btn-primary{ background:var(--ink); color:#fff; border-color:var(--ink); }
.btn-primary:hover{ background:var(--accent-dark); border-color:var(--accent-dark); }
.btn-danger{ background:var(--surface); color:var(--high); border-color:var(--high-soft); }
.btn-danger:hover{ background:var(--high-soft); }
.btn-ghost{ border-color:transparent; background:transparent; }
.btn-ghost:hover{ background:var(--surface-alt); }
.btn-sm{ padding:5px 10px; font-size:12px; }

.task-list{ display:flex; flex-direction:column; gap:8px; }
.task-card{ display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--border); border-radius:10px; background:var(--surface); cursor:pointer; transition:border-color .15s ease, box-shadow .15s ease; flex-wrap:wrap; }
.task-card:hover{ border-color:var(--accent); box-shadow:0 1px 0 rgba(14,124,134,0.08); }
.task-main{ flex:1 1 240px; min-width:0; }
.task-title{ font-weight:600; font-size:14px; margin:0 0 3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.task-meta{ font-size:12px; color:var(--ink-soft); display:flex; gap:8px; flex-wrap:wrap; }
.badge{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:600; white-space:nowrap; }
.badge-dot{ width:6px; height:6px; border-radius:50%; display:inline-block; }
.badge-high{ background:var(--high-soft); color:var(--high); }
.badge-high .badge-dot{ background:var(--high); }
.badge-medium{ background:var(--medium-soft); color:var(--medium); }
.badge-medium .badge-dot{ background:var(--medium); }
.badge-low{ background:var(--low-soft); color:var(--low); }
.badge-low .badge-dot{ background:var(--low); }
.badge-status{ background:var(--neutral-soft); color:var(--neutral); }
.badge-status.st-completed{ background:var(--success-soft); color:var(--success); }
.badge-status.st-blocked{ background:var(--blocked-soft); color:var(--blocked); }
.badge-status.st-progress{ background:var(--low-soft); color:var(--low); }
.due-label{ font-family:var(--font-mono); font-size:12px; }
.due-overdue{ color:var(--high); font-weight:600; }
.due-soon{ color:var(--medium); font-weight:600; }
.quick-status{ border:1px solid var(--border); border-radius:7px; padding:5px 8px; font-size:12px; background:var(--surface-alt); }

.bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:13px; }
.bar-label{ width:110px; flex-shrink:0; color:var(--ink-soft); }
.bar-track{ flex:1; background:var(--surface-alt); border-radius:999px; height:8px; overflow:hidden; }
.bar-fill{ height:100%; border-radius:999px; }
.bar-count{ width:28px; text-align:right; font-family:var(--font-mono); font-size:12px; color:var(--ink-soft); flex-shrink:0; }

table.workload{ width:100%; border-collapse:collapse; font-size:13px; }
table.workload th{ text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); font-weight:600; padding:0 10px 8px; border-bottom:1px solid var(--border); }
table.workload td{ padding:10px; border-bottom:1px solid var(--border); }
table.workload tr:last-child td{ border-bottom:none; }

.roster-card{ padding:10px 0; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:8px; }
.roster-card:last-of-type{ border-bottom:none; }
.roster-card-top{ display:flex; align-items:center; gap:8px; }
.roster-card-top input[type=text]{ flex:1; border:1px solid transparent; background:transparent; padding:6px 8px; border-radius:6px; font-size:13.5px; font-weight:600; }
.roster-card-top input[type=text]:hover, .roster-card-top input[type=text]:focus{ border-color:var(--border); background:var(--surface-alt); }
.roster-card-bottom{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-soft); }
.roster-check{ display:flex; align-items:center; gap:6px; cursor:pointer; }
.roster-card-bottom select{ border:1px solid var(--border); border-radius:7px; padding:5px 8px; font-size:12.5px; background:var(--surface-alt); }
.add-row{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center; }
.add-row input[type=text]{ flex:1 1 180px; border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:13.5px; }
.add-row label{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-soft); white-space:nowrap; }
.add-row select{ border:1px solid var(--border); border-radius:8px; padding:7px 10px; font-size:12.5px; background:var(--surface-alt); }

.empty-state{ text-align:center; padding:40px 20px; color:var(--ink-soft); font-size:13.5px; }
.empty-state strong{ display:block; color:var(--ink); font-size:14.5px; margin-bottom:4px; }

.who-am-i{ display:flex; align-items:center; gap:10px; margin-bottom:18px; background:var(--accent-soft); border:1px solid #cfe6e4; border-radius:10px; padding:10px 14px; font-size:13.5px; }
.who-am-i select{ border:1px solid var(--border); border-radius:7px; padding:6px 10px; font-weight:600; background:var(--surface); }

.login-wrap{ display:flex; justify-content:center; padding-top:8vh; }
.login-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:28px; width:100%; max-width:340px; box-shadow:0 12px 30px rgba(0,0,0,0.06); }
.login-error{ color:var(--high); font-size:12.5px; margin:8px 0 0; }
.login-name-grid{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
.login-name-btn{ border:1px solid var(--border); background:var(--surface-alt); padding:9px 14px; border-radius:9px; font-weight:600; font-size:13.5px; cursor:pointer; transition:border-color .15s ease, background .15s ease, color .15s ease; }
.login-name-btn:hover{ border-color:var(--accent); }
.login-name-btn.selected{ background:var(--ink); color:#fff; border-color:var(--ink); }
.field input:disabled + .login-error{ display:none; }
.task-select{ flex-shrink:0; }
.import-result{ margin-top:12px; padding:10px 12px; background:var(--surface-alt); border-radius:8px; font-size:12.5px; }
.import-errors{ margin:8px 0 0; padding-left:18px; color:var(--high); }
.import-errors li{ margin-bottom:3px; }
.link-btn{ background:none; border:none; padding:0; color:var(--accent); font-weight:600; cursor:pointer; text-decoration:underline; font-size:inherit; font-family:inherit; }
.link-btn:hover{ color:var(--accent-dark); }
.pin-input{ width:64px; border:1px solid var(--border); border-radius:7px; padding:5px 8px; font-size:12.5px; font-family:var(--font-mono); background:var(--surface-alt); letter-spacing:0.05em; }

.view-toggle{ margin-bottom:14px; }

.calendar-head{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.calendar-month-label{ font-family:var(--font-display); font-weight:700; font-size:15px; margin:0 4px; min-width:150px; }
.calendar-daynames{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; padding:0 2px; }
.calendar-daynames span{ text-align:center; }
.calendar-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.calendar-cell{ background:var(--surface); border:1px solid var(--border); border-radius:8px; min-height:88px; padding:6px; cursor:pointer; display:flex; flex-direction:column; gap:3px; overflow:hidden; }
.calendar-cell:hover{ border-color:var(--accent); }
.calendar-cell.other-month{ opacity:.4; }
.calendar-cell.today{ border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
.calendar-cell.selected{ background:var(--accent-soft); }
.calendar-date{ font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft); font-weight:600; }
.cal-chip{ font-size:10.5px; padding:2px 6px; border-radius:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
.cal-chip.badge-high{ background:var(--high-soft); color:var(--high); }
.cal-chip.badge-medium{ background:var(--medium-soft); color:var(--medium); }
.cal-chip.badge-low{ background:var(--low-soft); color:var(--low); }
.cal-chip.st-completed{ background:var(--success-soft); color:var(--success); }
.cal-more{ font-size:10.5px; color:var(--ink-faint); font-weight:600; cursor:pointer; }

.upcoming-day-group{ margin-bottom:16px; }
.upcoming-day-group:last-child{ margin-bottom:0; }
.upcoming-day-label{ font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; text-transform:uppercase; letter-spacing:.03em; }

.modal-overlay{ position:fixed; inset:0; background:rgba(18,24,31,0.45); backdrop-filter:blur(2px); display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; z-index:100; overflow-y:auto; }
.modal{ background:var(--surface); border-radius:14px; width:100%; max-width:560px; padding:22px; box-shadow:0 20px 50px rgba(0,0,0,0.2); }
.modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.modal-title{ font-family:var(--font-display); font-weight:700; font-size:17px; }
.field{ margin-bottom:12px; }
.field label{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; }
.field input[type=text], .field input[type=date], .field select, .field textarea{ width:100%; border:1px solid var(--border); border-radius:8px; padding:9px 10px; font-size:13.5px; background:var(--surface); }
.field input:disabled, .field select:disabled, .field textarea:disabled{ background:var(--surface-alt); color:var(--ink-soft); }
.field textarea{ resize:vertical; min-height:60px; }
.field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.priority-preview{ margin-top:7px; font-size:12px; color:var(--ink-soft); display:flex; align-items:center; gap:7px; }
.notes-list{ display:flex; flex-direction:column; gap:8px; max-height:140px; overflow-y:auto; margin-bottom:8px; }
.note-item{ background:var(--surface-alt); border-radius:8px; padding:8px 10px; font-size:12.5px; }
.note-date{ color:var(--ink-faint); font-family:var(--font-mono); font-size:11px; margin-bottom:2px; }
.modal-footer{ display:flex; justify-content:space-between; align-items:center; margin-top:18px; gap:10px; }
.modal-footer-right{ display:flex; gap:8px; }

.toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:8px; font-size:13px; z-index:200; opacity:0; pointer-events:none; transition:opacity .2s ease; }
.toast.show{ opacity:1; }

.loading-view{ padding:80px 0; text-align:center; color:var(--ink-soft); font-size:14px; }

@media (max-width:640px){
  .field-row{ grid-template-columns:1fr; }
  .bar-label{ width:80px; }
  .task-card{ align-items:flex-start; }
  .calendar-cell{ min-height:64px; padding:4px; }
  .cal-chip{ font-size:9.5px; }
  .calendar-date{ font-size:10px; }
  .calendar-month-label{ min-width:0; }
}

</style>
</head>
<body data-role="manager">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark"></span>
        <div>
          <div class="brand-name">Invisel</div>
          <div class="brand-sub">Task &amp; Deadline Tracker</div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="sync-status"><span class="dot-status" id="sync-dot"></span><span id="sync-text">Connecting…</span><button class="btn btn-ghost btn-sm" data-action="refresh" type="button">↻</button></div>
        <span id="logout-slot"></span>
        <nav class="role-switch" aria-label="Current view"><span class="role-tab" aria-selected="true">Manager</span></nav>
      </div>
    </div>
    <div class="sheen"></div>
  </header>
  <main>
    <div id="banner" class="banner" style="display:none;"></div>
    <div id="view"><div class="loading-view">Loading tasks…</div></div>
  </main>
  <div id="modal-root"></div>
  <div id="toast" class="toast"></div>

  <script>
var API_URL = "https://script.google.com/macros/s/AKfycbyDDylU0SIOdderxlX8KqlODV5zgH9ofqeHyG4gGR65zT6jnHEQSTlL_4WDejNvubDW/exec";
(function(){
  "use strict";

  var ROLE = document.body.getAttribute("data-role"); // "admin" | "manager" | "employee"

  var CATEGORIES = ["Marketing","Finance","E-commerce","Brand","R&D","Operations","Other"];
  var DEPARTMENTS = ["Marketing","Finance","E-commerce","Brand","R&D","Operations","Other"];
  var PRIORITIES = ["High","Medium","Low"];
  var STATUSES = ["Not Started","In Progress","Completed","Blocked"];

  // Deadline → priority thresholds, measured from the END date. Priority is DERIVED, never set by hand.
  var PRIORITY_RULES = { highWithinDays: 2, mediumWithinDays: 7 };
  var UPCOMING_DAYS = 14;
  var POLL_MS = 20000;
  var IMPORT_HEADERS = ["TaskID","Title","Description","Assignee","Category","Status","StartDate","EndDate"];

  // Admin PIN — change this before sharing the file. This is a UX gate, not
  // real security: this is a static site with a publicly-readable backend,
  // so treat it as "keeps casual visitors out," not "cryptographically safe."
  var ADMIN_PIN = "4242";

  var today = new Date(); today.setHours(0,0,0,0);

  function lsGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
  function lsSet(key, val){ try{ localStorage.setItem(key, val); }catch(e){} }
  function lsRemove(key){ try{ localStorage.removeItem(key); }catch(e){} }
  function randomPin(){ return String(Math.floor(1000 + Math.random()*9000)); }

  var state = {
    employeeViewer: null,
    managerViewer: null,
    tasks: [],
    team: [],
    filters: { assignee: "all", priority: "all", status: "all", category: "all", department: "all" },
    modal: null,
    loading: true,
    loggedIn: false,
    loginError: null,
    loginSelectedId: null,
    viewMode: "list", // "list" | "calendar"
    calendar: { year: today.getFullYear(), month: today.getMonth(), selectedDay: null },
    monthReview: { year: today.getFullYear(), month: today.getMonth() },
    selectedIds: {},
    lastVisibleIds: [],
    importResult: null
  };

  // ---------- utils ----------
  function uid(prefix){ return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function escapeHtml(str){
    return String(str == null ? "" : str).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function todayDate(){ var d = new Date(); d.setHours(0,0,0,0); return d; }
  function toISO(d){ return d.toISOString().slice(0,10); }
  function addDays(d, n){ var r = new Date(d); r.setDate(r.getDate()+n); return r; }
  function todayISO(){ return toISO(todayDate()); }
  function daysBetween(isoDate){
    var d = new Date(isoDate + "T00:00:00");
    var t = todayDate();
    return Math.round((d - t) / 86400000);
  }
  function formatDate(iso){
    if(!iso) return "—";
    var d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("en-IN", { day:"numeric", month:"short", year:"numeric" });
  }
  function isOverdue(t){ return t.status !== "Completed" && daysBetween(t.endDate) < 0; }
  function isDueSoon(t){ var db = daysBetween(t.endDate); return t.status !== "Completed" && db >= 0 && db <= 2; }

  // ---------- priority engine: derived from end date + status, never stored/edited directly ----------
  function computePriority(t){
    if(!t || !t.endDate) return null;
    if(t.status === "Completed") return null;
    var d = daysBetween(t.endDate);
    if(d < 0) return "High";
    if(d <= PRIORITY_RULES.highWithinDays) return "High";
    if(d <= PRIORITY_RULES.mediumWithinDays) return "Medium";
    return "Low";
  }
  function priorityRank(p){ return p === "High" ? 0 : p === "Medium" ? 1 : p === "Low" ? 2 : 3; }
  function priorityClass(p){ return p ? "badge-" + p.toLowerCase() : ""; }
  function statusClass(s){
    if(s === "Completed") return "st-completed";
    if(s === "Blocked") return "st-blocked";
    if(s === "In Progress") return "st-progress";
    return "";
  }

  function getMember(id){ return state.team.find(function(m){ return m.id === id; }); }

  // ---------- seed data (local demo mode only — team placeholders, no dummy tasks) ----------

  // ---------- migration: tolerate older data shapes from the Sheet ----------
  function normalizeTeam(team){
    return (team || []).map(function(m){
      var isMgr = !!m.isManager;
      var managerIds = isMgr ? [] : (m.managerIds && m.managerIds.length ? m.managerIds : (m.managerId ? [m.managerId] : []));

  function normalizeTasks(tasks){

      return {
        id: t.id,
        title: t.title,
        description: t.description || "",
        assigneeId: t.assigneeId || null,
        category: t.category || "Other",
        status: t.status || "Not Started",
        startDate: start,

  // ---------- backend (Google Apps Script + Sheet) ----------

  function loadData(){
    if(!isApiConfigured()){
      showBanner("Running in local demo mode — changes here won't be saved. Check <code>config.js</code>.", false);
      setSyncStatus("warn", "Local demo mode");
      state.team = normalizeTeam(seedTeam());
      state.tasks = [];
      afterLoad();
      return;
    }
    setSyncStatus("", "Connecting…");
    apiFetchState().then(function(data){
      var hasTeam = data && data.team && data.team.length;
      state.team = normalizeTeam(hasTeam ? data.team : seedTeam());
      state.tasks = normalizeTasks(data && data.tasks ? data.tasks : []);
      setSyncStatus("ok", "Backend connected");
      afterLoad();
      if(!hasTeam){
        apiSaveState({ tasks: state.tasks, team: state.team });
      }
    }).catch(function(){
      showBanner("Couldn't reach the backend. Check that the Apps Script is deployed with access set to \"Anyone\". Showing local sample data for now.", true);
      setSyncStatus("off", "Offline");
      state.team = normalizeTeam(seedTeam());
      state.tasks = [];
      afterLoad();
    });
  }

  function restoreSession(){
    if(ROLE === "admin"){
      if(lsGet("invisel_admin_ok") === "1") state.loggedIn = true;
      return;
    }
    if(ROLE === "manager"){
      var savedMgr = lsGet("invisel_manager_id");
      if(savedMgr && isManagerId(savedMgr)){ state.managerViewer = savedMgr; state.loggedIn = true; }
      return;
    }
    var savedEmp = lsGet("invisel_employee_id");
    var mem = savedEmp ? getMember(savedEmp) : null;
    if(mem && !mem.isManager){ state.employeeViewer = savedEmp; state.loggedIn = true; }
  }

  function afterLoad(){
    state.loading = false;
    restoreSession();
    render();
    startPolling();
  }

  function startPolling(){
    if(!isApiConfigured()) return;
    setInterval(function(){
      if(state.modal) return;
      apiFetchState().then(function(data){
        var newTasks = normalizeTasks(data.tasks || []);
        var newTeam = normalizeTeam(data.team || []);
        if(JSON.stringify(newTasks) !== JSON.stringify(state.tasks) || JSON.stringify(newTeam) !== JSON.stringify(state.team)){
          state.tasks = newTasks;
          state.team = newTeam;
          if(ROLE === "employee" && state.employeeViewer && !getMember(state.employeeViewer)){
            handleLogout();
            return;
          }
          if(ROLE === "manager" && state.managerViewer && !isManagerId(state.managerViewer)){
            handleLogout();
            return;
          }
          setSyncStatus("ok", "Backend connected");
          render();
        }
      }).catch(function(){ setSyncStatus("off", "Offline — retrying"); });
    }, POLL_MS);
  }

  function persist(){
    if(!isApiConfigured()){
      showToast("Local demo mode — this change won't be saved.");
      return;
    }
    setSyncStatus("", "Syncing…");
    apiSaveState({ tasks: state.tasks, team: state.team }).then(function(data){
      if(data && data.tasks) state.tasks = normalizeTasks(data.tasks);
      if(data && data.team) state.team = normalizeTeam(data.team);
      setSyncStatus("ok", "Backend connected");
      render();
    }).catch(function(){
      setSyncStatus("off", "Couldn't save — offline");
      showToast("Couldn't save — check your connection.");
    });
  }

  function manualRefresh(){
    if(!isApiConfigured()){ showToast("Local demo mode — nothing to refresh."); return; }
    setSyncStatus("", "Refreshing…");
    apiFetchState().then(function(data){
      state.tasks = normalizeTasks(data.tasks || []);
      state.team = normalizeTeam(data.team || []);
      setSyncStatus("ok", "Backend connected");
      render();
      showToast("Up to date.");
    }).catch(function(){ setSyncStatus("off", "Offline"); showToast("Couldn't refresh."); });
  }

  // ---------- computed ----------
  function statsFor(tasks){
    var overdue = tasks.filter(isOverdue).length;
    var dueSoon = tasks.filter(isDueSoon).length;
    var weekAgo = toISO(addDays(todayDate(), -7));
    var completedWeek = tasks.filter(function(t){ return t.status === "Completed" && t.completedDate && t.completedDate >= weekAgo; }).length;
    var completedTotal = tasks.filter(function(t){ return t.status === "Completed"; }).length;
    return { total: tasks.length, overdue: overdue, dueSoon: dueSoon, completedWeek: completedWeek, completedTotal: completedTotal };
  }
  function categoryBreakdown(tasks){
    var counts = {};
    tasks.forEach(function(t){ counts[t.category] = (counts[t.category]||0) + 1; });
    return counts;
  }
  function priorityBreakdown(tasks){
    var counts = { High:0, Medium:0, Low:0 };
    var active = tasks.filter(function(t){ return t.status !== "Completed"; });
    active.forEach(function(t){ var p = computePriority(t); if(p) counts[p]++; });
    return { counts: counts, total: active.length };
  }
  function sortTasks(tasks){
    return tasks.slice().sort(function(a,b){
      var ao = isOverdue(a) ? 0 : 1, bo = isOverdue(b) ? 0 : 1;
      if(ao !== bo) return ao - bo;
      var pr = priorityRank(computePriority(a)) - priorityRank(computePriority(b));
      if(pr !== 0) return pr;
      return a.endDate < b.endDate ? -1 : a.endDate > b.endDate ? 1 : 0;
    });
  }
  function applyFilters(tasks){
    var f = state.filters;
    return tasks.filter(function(t){
      if(f.assignee !== "all" && t.assigneeId !== f.assignee) return false;
      if(f.priority !== "all" && computePriority(t) !== f.priority) return false;
      if(f.status !== "all" && t.status !== f.status) return false;
      if(f.category !== "all" && t.category !== f.category) return false;
      if(f.department !== "all"){
        var owner = getMember(t.assigneeId);
        if(!owner || (owner.department || "Other") !== f.department) return false;
      }
      return true;
    });
  }
  function tasksOnDay(tasks, iso){
    return tasks.filter(function(t){ return t.startDate <= iso && iso <= t.endDate; });
  }

  // ---------- CSV / spreadsheet bulk import & export ----------
  function detectDelimiter(text){
    var firstLine = text.split(/\r?\n/)[0] || "";
    var tabs = (firstLine.match(/\t/g) || []).length;
    var commas = (firstLine.match(/,/g) || []).length;
    return tabs > commas ? "\t" : ",";
  }
  function parseDelimited(text, delim){
    var rows = [], field = "", row = [], inQuotes = false, i = 0, len = text.length;
    while(i < len){
      var c = text[i];
      if(inQuotes){
        if(c === '"'){
          if(text[i + 1] === '"'){ field += '"'; i += 2; continue; }
          inQuotes = false; i++; continue;
        }
        field += c; i++; continue;
      }
      if(c === '"'){ inQuotes = true; i++; continue; }
      if(c === delim){ row.push(field); field = ""; i++; continue; }
      if(c === "\r"){ i++; continue; }
      if(c === "\n"){ row.push(field); rows.push(row); row = []; field = ""; i++; continue; }
      field += c; i++;
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(function(r){ return !(r.length === 1 && r[0].trim() === ""); });
  }
  function findMemberByName(name){
    if(!name) return null;
    var n = name.trim().toLowerCase();
    return state.team.find(function(m){ return !m.isManager && m.name.trim().toLowerCase() === n; }) || null;
  }
  function pad2(n){ n = String(n); return n.length < 2 ? "0" + n : n; }
  function parseFlexibleDate(str){
    if(!str) return null;
    str = String(str).trim();
    var iso = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if(iso){
      var y1 = iso[1], m1 = parseInt(iso[2], 10), d1 = parseInt(iso[3], 10);
      if(m1 >= 1 && m1 <= 12 && d1 >= 1 && d1 <= 31) return y1 + "-" + pad2(m1) + "-" + pad2(d1);
      return null;
    }
    // Day-first: DD-MM-YYYY or DD/MM/YYYY (matches how dates display in this app and in Indian spreadsheets)
    var dmy = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if(dmy){
      var d2 = parseInt(dmy[1], 10), m2 = parseInt(dmy[2], 10), y2 = dmy[3];
      if(m2 >= 1 && m2 <= 12 && d2 >= 1 && d2 <= 31) return y2 + "-" + pad2(m2) + "-" + pad2(d2);
    }
    return null;
  }
  function runImport(text){
    var delim = detectDelimiter(text);
    var rows = parseDelimited(text.trim(), delim);
    if(!rows.length) return { added: 0, updated: 0, errors: ["No data found — paste rows or choose a file first."] };
    var header = rows[0].map(function(h){ return h.trim(); });
    var dataRows = rows.slice(1);
    var idIdx = header.indexOf("TaskID");
    var titleIdx = header.indexOf("Title");
    var descIdx = header.indexOf("Description");
    var assigneeIdx = header.indexOf("Assignee");
    var catIdx = header.indexOf("Category");
    var statusIdx = header.indexOf("Status");
    var startIdx = header.indexOf("StartDate");
    var endIdx = header.indexOf("EndDate");
    if(titleIdx === -1 || assigneeIdx === -1){
      return { added: 0, updated: 0, errors: ["Header row must include at least Title and Assignee columns — check against the template."] };
    }
    var added = 0, updated = 0, errors = [];
    var assignedByVal = ROLE === "manager" ? { type:"manager", id: state.managerViewer } : { type:"admin", id:null };
    dataRows.forEach(function(r, rowIdx){
      if(!r.some(function(c){ return c && c.trim(); })) return;
      var title = titleIdx !== -1 ? (r[titleIdx] || "").trim() : "";
      if(!title){ errors.push("Row " + (rowIdx + 2) + ": missing Title, skipped."); return; }
      var assigneeName = assigneeIdx !== -1 ? (r[assigneeIdx] || "").trim() : "";
      var member = findMemberByName(assigneeName);
      if(!member){ errors.push("Row " + (rowIdx + 2) + ": assignee \"" + assigneeName + "\" not found, skipped."); return; }
      var category = catIdx !== -1 && CATEGORIES.indexOf((r[catIdx] || "").trim()) !== -1 ? r[catIdx].trim() : "Other";
      var status = statusIdx !== -1 && STATUSES.indexOf((r[statusIdx] || "").trim()) !== -1 ? r[statusIdx].trim() : "Not Started";
      var startRaw = startIdx !== -1 ? (r[startIdx] || "").trim() : "";
      var start = startRaw ? parseFlexibleDate(startRaw) : null;
      if(startRaw && !start){ errors.push("Row " + (rowIdx + 2) + ": couldn't understand start date \"" + startRaw + "\" — used today instead. Use YYYY-MM-DD or DD-MM-YYYY."); }
      if(!start) start = todayISO();
      var endRaw = endIdx !== -1 ? (r[endIdx] || "").trim() : "";
      var end = endRaw ? parseFlexibleDate(endRaw) : null;
      if(endRaw && !end){ errors.push("Row " + (rowIdx + 2) + ": couldn't understand end date \"" + endRaw + "\" — used start date instead. Use YYYY-MM-DD or DD-MM-YYYY."); }
      if(!end) end = start;
      if(end < start) end = start;
      var desc = descIdx !== -1 ? (r[descIdx] || "").trim() : "";
      var idVal = idIdx !== -1 ? (r[idIdx] || "").trim() : "";
      var existing = idVal ? state.tasks.find(function(t){ return t.id === idVal; }) : null;
      if(existing){
        existing.title = title;
        existing.description = desc;
        existing.assigneeId = member.id;
        existing.category = category;
        if(existing.status !== "Completed" && status === "Completed") existing.completedDate = todayISO();
        if(status !== "Completed") existing.completedDate = null;
        existing.status = status;
        existing.startDate = start;
        existing.endDate = end;
        updated++;
      } else {
        state.tasks.push({
          id: uid("t"), title: title, description: desc, assigneeId: member.id, category: category, status: status,
          startDate: start, endDate: end, createdDate: todayISO(), completedDate: status === "Completed" ? todayISO() : null,
          notes: [], assignedBy: assignedByVal
        });
        added++;
      }
    });
    return { added: added, updated: updated, errors: errors };
  }
  function csvEscape(v){
    v = String(v == null ? "" : v);
    if(/["\n,]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
    return v;
  }
  function downloadTextFile(filename, text){
    var blob = new Blob([text], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }
  function exportTasksCSV(tasksList){
    var lines = [IMPORT_HEADERS.join(",")];
    tasksList.forEach(function(t){
      lines.push([t.id, t.title, t.description, memberName(t.assigneeId), t.category, t.status, t.startDate, t.endDate].map(csvEscape).join(","));
    });
    downloadTextFile("invisel-tasks-" + todayISO() + ".csv", lines.join("\r\n"));
  }
  function downloadImportTemplate(){
    var lines = [
      IMPORT_HEADERS.join(","),
      ["", "Example task — replace this row", "Optional description", "Team Member 1", "Marketing", "Not Started", todayISO(), todayISO()].map(csvEscape).join(",")
    ];
    downloadTextFile("invisel-tasks-template.csv", lines.join("\r\n"));
  }
  function currentScopeTasks(){
    if(ROLE === "admin") return state.tasks;
    if(ROLE === "manager"){
      var reporteeIds = reporteesOf(state.managerViewer).map(function(m){ return m.id; });
      return state.tasks.filter(function(t){
        return reporteeIds.indexOf(t.assigneeId) !== -1 ||
          (t.assignedBy && t.assignedBy.type === "manager" && t.assignedBy.id === state.managerViewer);
      });
    }
    return state.tasks.filter(function(t){ return t.assigneeId === state.employeeViewer; });
  }
  function importPanel(){
    var resultHtml = "";

      var r = state.importResult;
      resultHtml = '<div class="import-result">' +

        '<textarea id="import-text" rows="5" placeholder="Paste CSV or tab-separated rows here…" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 10px;font-family:var(--font-mono);font-size:12px;"></textarea>' +
        '<div style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;">' +
          '<input type="file" id="import-file" accept=".csv,text/csv" style="font-size:12.5px;max-width:220px;">' +
          '<button class="btn btn-primary btn-sm" data-action="run-import" type="button">Import</button>' +
          '<button class="btn btn-ghost btn-sm" data-action="export-tasks" type="button">Export current tasks (CSV)</button>' +
          '<button class="btn btn-ghost btn-sm" data-action="download-template" type="button">Download template</button>' +
        '</div>' +
        resultHtml +
      '</div>';
  }

  function dueLabel(t){
    var db = daysBetween(t.endDate);

    if(t.status !== "Completed"){
      if(db < 0){ cls += " due-overdue"; text += " · " + Math.abs(db) + "d overdue"; }
      else if(db <= 2){ cls += " due-soon"; text += db === 0 ? " · today" : (" · in " + db + "d"); }

  }

      '<select data-filter="priority">' + priorityOpts + '</select>' +
      '<select data-filter="status">' + statusOpts + '</select>' +
      '<select data-filter="category">' + catOpts + '</select>' +
      '</div>';
  }
  function viewToggle(){
    return '<div class="role-switch view-toggle">' +
      '<button class="role-tab" data-action="set-view" data-mode="list" aria-selected="' + (state.viewMode === "list") + '" type="button">List</button>' +
      '<button class="role-tab" data-action="set-view" data-mode="calendar" aria-selected="' + (state.viewMode === "calendar") + '" type="button">Calendar</button>' +
      '</div>';
  }
  function priorityBreakdownBars(tasks){
    var b = priorityBreakdown(tasks);
    var max = Math.max(1, b.total);
    return PRIORITIES.map(function(p){
      var c = b.counts[p] || 0;
      var color = p === "High" ? "var(--high)" : p === "Medium" ? "var(--medium)" : "var(--low)";
      return '<div class="bar-row"><span class="bar-label">' + p + '</span><div class="bar-track"><div class="bar-fill" style="width:' + (c/max*100) + '%;background:' + color + '"></div></div><span class="bar-count">' + c + '</span></div>';
    }).join("") + '<p class="section-hint" style="margin:2px 0 0;">Priority is set automatically from each task\u2019s end date — not chosen by hand.</p>';
  }
  function categoryBreakdownBars(tasks){
    var counts = categoryBreakdown(tasks);
    var max = Math.max(1, tasks.length);
    return CATEGORIES.filter(function(c){ return counts[c]; }).map(function(c){
      var n = counts[c] || 0;
      return '<div class="bar-row"><span class="bar-label">' + c + '</span><div class="bar-track"><div class="bar-fill" style="width:' + (n/max*100) + '%;background:var(--accent)"></div></div><span class="bar-count">' + n + '</span></div>';
    }).join("") || '<p class="section-hint">No tasks yet.</p>';
  }
  function personLinkHtml(m){
    return '<button type="button" class="link-btn" data-action="filter-person" data-id="' + m.id + '">' + escapeHtml(m.name) + '</button>';
  }
  function workloadTable(members, tasksList){
    members = members || state.team;
    tasksList = tasksList || state.tasks;
    if(!members.length) return '<p class="section-hint">No team members yet.</p>';
    var rows = members.map(function(m){
      var mine = tasksList.filter(function(t){ return t.assigneeId === m.id; });
      var completed = mine.filter(function(t){ return t.status === "Completed"; }).length;
      var overdue = mine.filter(isOverdue).length;
      var rate = mine.length ? Math.round(completed / mine.length * 100) : 0;
      return '<tr><td>' + personLinkHtml(m) + '</td><td>' + mine.length + '</td><td>' + completed + '</td><td' + (overdue ? ' style="color:var(--high);font-weight:600;"' : '') + '>' + overdue + '</td><td>' + rate + '%</td></tr>';
    }).join("");
    return '<table class="workload"><thead><tr><th>Name</th><th>Assigned</th><th>Completed</th><th>Overdue</th><th>Completion</th></tr></thead><tbody>' + rows + '</tbody></table><p class="section-hint" style="margin-top:8px;">Click a name to jump to their tasks.</p>';
  }
  function monthRangeIso(y, m){ return [isoFor(y, m, 1), isoFor(y, m + 1, 0)]; }
  function tasksInMonth(tasks, y, m){
    var range = monthRangeIso(y, m);
    return tasks.filter(function(t){ return t.endDate >= range[0] && t.endDate <= range[1]; });
  }
  function monthlyStats(tasks, y, m){
    var inMonth = tasksInMonth(tasks, y, m);
    var completed = inMonth.filter(function(t){ return t.status === "Completed"; });
    var onTime = completed.filter(function(t){ return t.completedDate && t.completedDate <= t.endDate; });
    return {
      total: inMonth.length,
      completed: completed.length,
      completionRate: inMonth.length ? Math.round(completed.length / inMonth.length * 100) : 0,
      onTimeRate: completed.length ? Math.round(onTime.length / completed.length * 100) : 0
    };
  }
  function monthNavHead(){
    var y = state.monthReview.year, m = state.monthReview.month;
    var label = new Date(y, m, 1).toLocaleDateString("en-IN", { month:"long", year:"numeric" });
    var isCurrent = (y === today.getFullYear() && m === today.getMonth());
    return '<div class="calendar-head">' +
      '<button class="btn btn-ghost btn-sm" data-action="month-prev" type="button">‹</button>' +
      '<span class="calendar-month-label">' + label + (isCurrent ? " (MTD)" : "") + '</span>' +
      '<button class="btn btn-ghost btn-sm" data-action="month-next" type="button">›</button>' +
      '<button class="btn btn-ghost btn-sm" data-action="month-current" type="button">This month</button>' +
      '</div>';
  }
  function monthlyPanel(tasks){
    var y = state.monthReview.year, m = state.monthReview.month;
    var s = monthlyStats(tasks, y, m);
    return monthNavHead() +
      '<div class="stat-grid">' +
        statCard("Tasks due", s.total, "") +
        statCard("Completed", s.completed, "ok") +
        statCard("Completion rate", s.completionRate + "%", "") +
        statCard("On-time rate", s.onTimeRate + "%", "") +
      '</div>';
  }
  function monthlyBreakdownTable(members, tasksList){
    var y = state.monthReview.year, m = state.monthReview.month;
    if(!members.length) return '<p class="section-hint">No one to show yet.</p>';
    var rows = members.map(function(mem){
      var mine = tasksList.filter(function(t){ return t.assigneeId === mem.id; });
      var s = monthlyStats(mine, y, m);
      return '<tr><td>' + personLinkHtml(mem) + '</td><td>' + s.total + '</td><td>' + s.completed + '</td><td>' + s.completionRate + '%</td><td>' + s.onTimeRate + '%</td></tr>';
    }).join("");
    return '<table class="workload"><thead><tr><th>Name</th><th>Tasks due</th><th>Completed</th><th>Completion</th><th>On-time</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }
  function departmentBreakdownTable(){
    var employees = state.team.filter(function(m){ return !m.isManager; });
    var byDept = {};
    employees.forEach(function(m){
      var d = m.department || "Other";
      byDept[d] = byDept[d] || [];
      byDept[d].push(m);
    });
    var depts = DEPARTMENTS.filter(function(d){ return byDept[d] && byDept[d].length; });
    if(!depts.length) return '<p class="section-hint">No employees yet.</p>';
    var rows = depts.map(function(d){
      var people = byDept[d];
      var ids = people.map(function(p){ return p.id; });
      var deptTasks = state.tasks.filter(function(t){ return ids.indexOf(t.assigneeId) !== -1; });
      var completed = deptTasks.filter(function(t){ return t.status === "Completed"; }).length;
      var overdue = deptTasks.filter(isOverdue).length;
      var rate = deptTasks.length ? Math.round(completed / deptTasks.length * 100) : 0;
      return '<tr><td>' + escapeHtml(d) + '</td><td>' + people.length + '</td><td>' + deptTasks.length + '</td><td>' + completed + '</td><td' + (overdue ? ' style="color:var(--high);font-weight:600;"' : '') + '>' + overdue + '</td><td>' + rate + '%</td></tr>';
    }).join("");
    return '<table class="workload"><thead><tr><th>Department</th><th>People</th><th>Tasks</th><th>Completed</th><th>Overdue</th><th>Completion</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }
  function showBanner(html, isError){
    var el = document.getElementById("banner");
    if(!el) return;
    el.className = "banner" + (isError ? " banner-error" : "");
    el.innerHTML = html;
    el.style.display = "block";
  }

  function upcomingPanel(tasks){
    var order = [];
    for(var i = 0; i < UPCOMING_DAYS; i++) order.push(toISO(addDays(todayDate(), i)));
    var groups = {};
    order.forEach(function(iso){ groups[iso] = []; });
    tasks.forEach(function(t){
      if(t.status === "Completed") return;
      if(groups.hasOwnProperty(t.endDate)) groups[t.endDate].push(t);
    });
    var overdue = sortTasks(tasks.filter(isOverdue));
    var html = "";
    if(overdue.length){
      html += '<div class="upcoming-day-group"><div class="upcoming-day-label" style="color:var(--high);">Overdue</div><div class="task-list">' + overdue.map(function(t){ return taskCard(t); }).join("") + '</div></div>';
    }
    var any = false;
    order.forEach(function(iso){
      var dayTasks = groups[iso];
      if(dayTasks && dayTasks.length){
        any = true;
        var label = iso === todayISO() ? "Today" : formatDate(iso);
        html += '<div class="upcoming-day-group"><div class="upcoming-day-label">' + label + '</div><div class="task-list">' + sortTasks(dayTasks).map(function(t){ return taskCard(t); }).join("") + '</div></div>';
      }
    });
    if(!overdue.length && !any) html += '<p class="section-hint">Nothing overdue or due in the next ' + UPCOMING_DAYS + ' days.</p>';
    return html;
  }

  function isoFor(y, m, d){ return toISO(new Date(y, m, d)); }

  function calendarView(tasks){
    var y = state.calendar.year, m = state.calendar.month;
    var first = new Date(y, m, 1);
    var startWeekday = first.getDay();
    var totalDays = new Date(y, m+1, 0).getDate();
    var prevMonthDays = new Date(y, m, 0).getDate();
    var cells = [];
    for(var i = startWeekday - 1; i >= 0; i--) cells.push({ day: prevMonthDays - i, iso: isoFor(y, m-1, prevMonthDays - i), other:true });
    for(var d = 1; d <= totalDays; d++) cells.push({ day: d, iso: isoFor(y, m, d), other:false });
    var rem = cells.length % 7;
    if(rem){ var extra = 7 - rem; for(var e = 1; e <= extra; e++) cells.push({ day: e, iso: isoFor(y, m+1, e), other:true }); }

    var monthLabel = first.toLocaleDateString("en-IN", { month:"long", year:"numeric" });
    var todayIso = todayISO();
    var dayNames = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

    var head = '<div class="calendar-head">' +
      '<button class="btn btn-ghost btn-sm" data-action="cal-prev" type="button">‹</button>' +
      '<span class="calendar-month-label">' + monthLabel + '</span>' +
      '<button class="btn btn-ghost btn-sm" data-action="cal-next" type="button">›</button>' +
      '<button class="btn btn-ghost btn-sm" data-action="cal-today" type="button">Today</button>' +
      '</div>';
    var dayNamesHtml = '<div class="calendar-daynames">' + dayNames.map(function(n){ return '<span>' + n + '</span>'; }).join("") + '</div>';

    var gridHtml = '<div class="calendar-grid">' + cells.map(function(c){
      var dayTasks = sortTasks(tasksOnDay(tasks, c.iso));
      var shown = dayTasks.slice(0, 3);
      var more = dayTasks.length - shown.length;
      var chips = shown.map(function(t){
        var p = computePriority(t);
        var range = formatDate(t.startDate) + ' → ' + formatDate(t.endDate);
        return '<div class="cal-chip ' + (p ? priorityClass(p) : "st-completed") + '" data-action="open-task" data-id="' + t.id + '" title="' + escapeHtml(t.title) + ' · ' + range + '">' + escapeHtml(t.title) + '</div>';
      }).join("");
      var moreHtml = more > 0 ? '<div class="cal-more" data-action="select-day" data-date="' + c.iso + '">+' + more + ' more</div>' : "";
      var cls = "calendar-cell" + (c.other ? " other-month" : "") + (c.iso === todayIso ? " today" : "") + (c.iso === state.calendar.selectedDay ? " selected" : "");
      return '<div class="' + cls + '" data-action="select-day" data-date="' + c.iso + '"><div class="calendar-date">' + c.day + '</div>' + chips + moreHtml + '</div>';
    }).join("") + '</div>';

    var agendaHtml = "";
    if(state.calendar.selectedDay){
      var dayTasks2 = sortTasks(tasksOnDay(tasks, state.calendar.selectedDay));
      agendaHtml = '<div class="panel" style="margin-top:14px;"><h3>' + formatDate(state.calendar.selectedDay) + '</h3>' +
        (dayTasks2.length ? '<div class="task-list">' + dayTasks2.map(function(t){ return taskCard(t); }).join("") + '</div>' : '<p class="section-hint">Nothing scheduled.</p>') +
        '</div>';
    }
    return '<div class="calendar">' + head + dayNamesHtml + gridHtml + '</div>' + agendaHtml;
  }

  // ---------- roster (Admin only) ----------
  function rosterCard(m){
    var allManagers = state.team.filter(function(x){ return x.isManager; });
    var myManagerIds = m.managerIds || [];
    var reportsOpts = allManagers.map(function(mg){
      return '<option value="' + mg.id + '"' + (myManagerIds.indexOf(mg.id) !== -1 ? " selected" : "") + '>' + escapeHtml(mg.name) + '</option>';
    }).join("");
    var deptOpts = DEPARTMENTS.map(function(d){
      return '<option value="' + d + '"' + (m.department === d ? " selected" : "") + '>' + d + '</option>';
    }).join("");
    var bottom = m.isManager
      ? '<span class="section-hint">Manages ' + reporteesOf(m.id).length + ' ' + (reporteesOf(m.id).length === 1 ? "person" : "people") + '</span>'
      : (allManagers.length
        ? '<span>Reports to</span><select multiple size="' + Math.min(3, allManagers.length) + '" title="Ctrl/Cmd-click to select more than one" data-action="set-reports-to" data-id="' + m.id + '">' + reportsOpts + '</select>'
        : '<span class="section-hint">No managers set up yet</span>');
    return '' +
      '<div class="roster-card">' +
        '<div class="roster-card-top">' +
          '<input type="text" value="' + escapeHtml(m.name) + '" data-action="rename-member" data-id="' + m.id + '">' +
          '<button class="btn btn-ghost btn-sm" data-action="remove-member" data-id="' + m.id + '">Remove</button>' +
        '</div>' +
        '<div class="roster-card-bottom">' +
          '<label class="roster-check"><input type="checkbox" data-action="toggle-manager" data-id="' + m.id + '"' + (m.isManager ? " checked" : "") + '> Manager</label>' +
          bottom +
          '<span>Dept</span><select data-action="set-department" data-id="' + m.id + '">' + deptOpts + '</select>' +
          '<span>PIN</span><input type="text" class="pin-input" inputmode="numeric" maxlength="6" value="' + escapeHtml(m.pin || "") + '" data-action="set-pin" data-id="' + m.id + '">' +
        '</div>' +
      '</div>';
  }

  // ---------- login / session ----------
  function renderLogin(){
    if(ROLE === "admin"){
      return '<div class="login-wrap"><div class="login-card">' +
        '<h2 class="section-title" style="margin-bottom:4px;">Admin login</h2>' +
        '<p class="section-hint" style="margin-bottom:16px;">Enter the admin PIN to continue.</p>' +
        '<div class="field"><label for="login-pin">PIN</label><input type="password" inputmode="numeric" id="login-pin"></div>' +

        '<button class="btn btn-primary" data-action="do-login" type="button" style="width:100%;margin-top:6px;">Log in</button>' +
        '</div></div>';
    }

    if(!pool.length){
      return '<div class="login-wrap"><div class="login-card">' +

    }).join("");
    var hasSelection = !!state.loginSelectedId;
    return '<div class="login-wrap"><div class="login-card">' +
      '<h2 class="section-title" style="margin-bottom:4px;">' + (ROLE === "manager" ? "Manager" : "Employee") + ' login</h2>' +
      '<p class="section-hint" style="margin-bottom:12px;">Tap your name, then enter your PIN.</p>' +
      '<div class="login-name-grid">' + nameButtons + '</div>' +
      '<div class="field"><label for="login-pin">PIN</label><input type="password" inputmode="numeric" id="login-pin"' + (hasSelection ? "" : " disabled") + '></div>' +
      (state.loginError ? '<p class="login-error">' + escapeHtml(state.loginError) + '</p>' : "") +
      '<button class="btn btn-primary" data-action="do-login" type="button" style="width:100%;margin-top:6px;"' + (hasSelection ? "" : " disabled") + '>Log in</button>' +
      '<p class="section-hint" style="margin-top:10px;">Forgot your PIN? Ask an Admin to look it up or reset it.</p>' +
      '</div></div>';
  }
  function handleLoginSubmit(){
    var pinEl = document.getElementById("login-pin");
    var pin = pinEl ? pinEl.value.trim() : "";
    if(ROLE === "admin"){
      if(pin && pin === ADMIN_PIN){
        lsSet("invisel_admin_ok", "1");
        state.loggedIn = true; state.loginError = null;
        render();
      } else {
        state.loginError = "Incorrect PIN.";
        renderView();
      }
      return;
    }
    var id = state.loginSelectedId || "";
    var mem = getMember(id);
    if(mem && pin && String(mem.pin || "") === pin){
      if(ROLE === "manager"){ state.managerViewer = id; lsSet("invisel_manager_id", id); }
      else { state.employeeViewer = id; lsSet("invisel_employee_id", id); }
      state.loggedIn = true; state.loginError = null; state.loginSelectedId = null;
      render();
    } else {
      state.loginError = "Name and PIN don't match.";
      renderView();
    }
  }
  function handleLogout(){
    if(ROLE === "admin") lsRemove("invisel_admin_ok");
    if(ROLE === "manager") lsRemove("invisel_manager_id");
    if(ROLE === "employee") lsRemove("invisel_employee_id");
    state.loggedIn = false;
    state.managerViewer = null;
    state.employeeViewer = null;
    state.loginError = null;
    state.loginSelectedId = null;
    state.selectedIds = {};
    state.importResult = null;
    render();
  }
  function updateLogoutControl(){
    var slot = document.getElementById("logout-slot");
    if(!slot) return;
    slot.innerHTML = state.loggedIn ? '<button class="btn btn-ghost btn-sm" data-action="logout" type="button">Log out</button>' : "";
  }
