  function renderManager(){
    var mgrs = managers();
    if(!mgrs.length){
      return emptyState("No managers set up yet", "Ask an Admin to check \u201cManager\u201d for someone in the team roster.");
    }
    if(!state.managerViewer || !isManagerId(state.managerViewer)) state.managerViewer = mgrs[0].id;
    var reportees = reporteesOf(state.managerViewer);
    var reporteeIds = reportees.map(function(m){ return m.id; });
    // A manager sees tasks for their direct reportees, PLUS anything they've personally
    // assigned to someone else — managers can assign across the whole team, not just
    // their own reportees, so this keeps whatever they've delegated visible to them too.
    var myTasks = state.tasks.filter(function(t){
      return reporteeIds.indexOf(t.assigneeId) !== -1 ||
        (t.assignedBy && t.assignedBy.type === "manager" && t.assignedBy.id === state.managerViewer);
    });
    var visiblePeopleIds = {};
    myTasks.forEach(function(t){ if(t.assigneeId) visiblePeopleIds[t.assigneeId] = true; });
    reporteeIds.forEach(function(id){ visiblePeopleIds[id] = true; });
    var visiblePeople = state.team.filter(function(m){ return !m.isManager && visiblePeopleIds[m.id]; });
    var visible = sortTasks(applyFilters(myTasks));
    var stats = statsFor(myTasks);

    return '' +
      '<div class="who-am-i">Logged in as <strong>' + escapeHtml(memberName(state.managerViewer)) + '</strong></div>' +
      (!reportees.length ? '<div class="banner" style="display:block;">No one reports directly to ' + escapeHtml(memberName(state.managerViewer)) + ' yet — you can still assign tasks to anyone on the team below.</div>' : "") +
      '<div class="stat-grid">' +
        statCard("Total tasks", stats.total, "") +
        statCard("Overdue", stats.overdue, stats.overdue ? "warn" : "") +
        statCard("Due in 7 days", stats.dueSoon, "") +
        statCard("Completed this week", stats.completedWeek, "ok") +
      '</div>' +

      '<div class="section-head"><h2 class="section-title">Team tasks</h2><button class="btn btn-primary btn-sm" data-action="open-add-task">+ Add task</button></div>' +
      '<p class="section-hint" style="margin:-10px 0 12px;">You can assign to anyone on the team, not just your direct reportees.</p>' +
      viewToggle() +
      (state.viewMode === "list" ? filterBar(true, visiblePeople, true) : "") +
      (state.viewMode === "calendar"
        ? calendarView(myTasks)
        : bulkControlsHtml(visible.map(function(t){ return t.id; })) + '<div class="task-list">' + (visible.length ? visible.map(function(t){ return taskCard(t, { selectable:true }); }).join("") : emptyState("No tasks match", "Try adding a task, or adjusting the filters above.")) + '</div>') +

      '<div class="section-head"><h2 class="section-title">Bulk import</h2><span class="section-hint">Add or update many tasks at once, e.g. after the morning meeting</span></div>' +
      importPanel() +

      '<div class="section-head"><h2 class="section-title">Monthly performance</h2><span class="section-hint">Your team, for the month shown</span></div>' +
      '<div class="panel">' + monthlyPanel(myTasks) + '</div>' +
      '<div class="panel" style="margin-top:14px;"><h3>By person</h3>' + monthlyBreakdownTable(visiblePeople, myTasks) + '</div>' +

      '<div class="section-head"><h2 class="section-title">Insights</h2></div>' +
      '<div class="panel"><h3>Priority mix (auto, from end dates)</h3>' + priorityBreakdownBars(myTasks) + '</div>' +
      '<div class="panel"><h3>Workload by person</h3>' + workloadTable(visiblePeople, myTasks) + '</div>';
  }

  function renderEmployee(){
    if(!state.team.length){
      return emptyState("No team members yet", "Ask an Admin to add people from the Admin tab.");
    }
    var mine = state.tasks.filter(function(t){ return t.assigneeId === state.employeeViewer; });
    var sorted = sortTasks(mine);
    var stats = statsFor(mine);
    return '' +
      '<div class="who-am-i">Logged in as <strong>' + escapeHtml(memberName(state.employeeViewer)) + '</strong></div>' +
      '<div class="stat-grid">' +
        statCard("My tasks", stats.total, "") +
        statCard("Overdue", stats.overdue, stats.overdue ? "warn" : "") +
        statCard("Due in 7 days", stats.dueSoon, "") +
        statCard("Completed", stats.completedTotal, "ok") +
      '</div>' +
      '<div class="section-head"><h2 class="section-title">My tasks</h2><button class="btn btn-primary btn-sm" data-action="open-add-task">+ Add task</button></div>' +
      '<p class="section-hint" style="margin:-10px 0 12px;">Tasks from your manager: view and update status only. Tasks you add yourself: fully yours to edit.</p>' +
      viewToggle() +
      (state.viewMode === "calendar"
        ? calendarView(mine)
        : '<div class="task-list">' + (sorted.length ? sorted.map(function(t){ return taskCard(t, { showAssignedBy:true }); }).join("") : emptyState("Nothing assigned", "You're all caught up.")) + '</div>') +
      '<div class="section-head"><h2 class="section-title">My monthly performance</h2><span class="section-hint">Great for checking in at month-end</span></div>' +
      '<div class="panel">' + monthlyPanel(mine) + '</div>';
  }

  function renderView(){
    var view = document.getElementById("view");
    if(state.loading){ view.innerHTML = '<div class="loading-view">Loading tasks…</div>'; updateLogoutControl(); return; }
    if(!state.loggedIn){ view.innerHTML = renderLogin(); updateLogoutControl(); highlightNav(); return; }
    if(ROLE === "admin") view.innerHTML = renderAdmin();
    else if(ROLE === "manager") view.innerHTML = renderManager();
    else view.innerHTML = renderEmployee();
    highlightNav();
    updateLogoutControl();
  }
  function highlightNav(){
    document.querySelectorAll(".role-tab[data-role]").forEach(function(a){
      a.setAttribute("aria-selected", a.getAttribute("data-role") === ROLE ? "true" : "false");
    });
  }

  // ---------- modal ----------
  function openModal(mode, taskId){
    var task = taskId ? state.tasks.find(function(t){ return t.id === taskId; }) : null;
    state.modal = { mode: mode, taskId: taskId || null, notes: task ? task.notes.slice() : [] };
    renderModal();
  }
  function closeModal(){
    state.modal = null;
    document.getElementById("modal-root").innerHTML = "";
  }
  function canEditFully(){ return ROLE === "admin" || ROLE === "manager"; }

  function renderModal(){
    var root = document.getElementById("modal-root");
    if(!state.modal){ root.innerHTML = ""; return; }
    var m = state.modal;
    var isAdd = m.mode === "add";
    var task = isAdd ? null : state.tasks.find(function(t){ return t.id === m.taskId; });
    var isOwnTask = ROLE === "employee" && task && task.assigneeId === state.employeeViewer;
    var selfTask = isSelfAddedTask(task);
    var isEmployeeAdd = isAdd && ROLE === "employee";
    var fieldsEditable = isAdd || canEditFully() || selfTask;
    var disabledAttr = fieldsEditable ? "" : " disabled";

    var assigneePool = isAdd ? assignableMembers() : state.team;
    var assigneeOpts = assigneePool.map(function(mem){
      var sel = task && task.assigneeId === mem.id ? " selected" : "";
      return '<option value="' + mem.id + '"' + sel + '>' + escapeHtml(mem.name) + '</option>';
    }).join("");
    var assigneeFieldHtml = isEmployeeAdd
      ? ""
      : (isAdd
        ? '<div class="field"><label for="f-assignees">Assign to</label><select id="f-assignees" multiple size="' + Math.max(2, Math.min(6, assigneePool.length)) + '">' + assigneeOpts + '</select><p class="section-hint" style="margin-top:4px;">Ctrl/Cmd-click to select more than one — a separate copy of this task is created for each person, so everyone tracks their own status.</p></div>'
        : '<div class="field"><label for="f-assignee">Assignee</label><select id="f-assignee"' + disabledAttr + '>' + assigneeOpts + '</select></div>');
    var categoryOpts = CATEGORIES.map(function(c){
      var sel = (task ? task.category === c : c === CATEGORIES[0]) ? " selected" : "";
      return '<option value="' + c + '"' + sel + '>' + c + '</option>';
    }).join("");
    var statusOpts = STATUSES.map(function(s){
      var sel = (task ? task.status === s : s === "Not Started") ? " selected" : "";
      return '<option value="' + s + '"' + sel + '>' + s + '</option>';
    }).join("");

    var notesHtml = m.notes.length
      ? m.notes.map(function(n){ return '<div class="note-item"><div class="note-date">' + formatDate(n.date) + '</div>' + escapeHtml(n.text) + '</div>'; }).join("")
      : '<p class="section-hint" style="margin:0;">No notes yet.</p>';

    var canDelete = !isAdd && (ROLE === "admin" || ROLE === "manager" || selfTask);
    var canSave = isAdd ? true : (canEditFully() || isOwnTask);
    var initialStart = task ? task.startDate : todayISO();
    var initialEnd = task ? task.endDate : todayISO();
    var initialStatus = task ? task.status : "Not Started";
    var assignedByText = task ? assignedByLabel(task) : null;

    root.innerHTML = '' +
      '<div class="modal-overlay" data-action="overlay-close">' +
        '<div class="modal">' +
          '<div class="modal-head"><h3 class="modal-title">' + (isAdd ? "New task" : "Task details") + '</h3><button class="btn btn-ghost btn-sm" data-action="close-modal">Close</button></div>' +
          (assignedByText ? '<p class="section-hint" style="margin:-8px 0 12px;">Assigned by ' + escapeHtml(assignedByText) + '</p>' : "") +
          '<div class="field"><label for="f-title">Title</label><input type="text" id="f-title" value="' + escapeHtml(task ? task.title : "") + '"' + disabledAttr + '></div>' +
          '<div class="field"><label for="f-desc">Description</label><textarea id="f-desc"' + disabledAttr + '>' + escapeHtml(task ? task.description : "") + '</textarea></div>' +
          (isAdd
            ? assigneeFieldHtml + '<div class="field"><label for="f-category">Category</label><select id="f-category"' + disabledAttr + '>' + categoryOpts + '</select></div>'
            : '<div class="field-row">' + assigneeFieldHtml + '<div class="field"><label for="f-category">Category</label><select id="f-category"' + disabledAttr + '>' + categoryOpts + '</select></div></div>') +
          '<div class="field-row">' +
            '<div class="field"><label for="f-start">Start date</label><input type="date" id="f-start" value="' + initialStart + '"' + disabledAttr + '></div>' +
            '<div class="field"><label for="f-end">End date (deadline)</label><input type="date" id="f-end" value="' + initialEnd + '"' + disabledAttr + '><div class="priority-preview">Priority: <span id="priority-preview-badge"></span></div></div>' +
          '</div>' +
          '<div class="field"><label for="f-status">Status</label><select id="f-status">' + statusOpts + '</select></div>' +
          (!isAdd ? '<div class="field"><label>Notes</label><div class="notes-list" id="notes-list">' + notesHtml + '</div><div style="display:flex;gap:8px;"><input type="text" id="f-note" placeholder="Add a note…" style="flex:1;border:1px solid var(--border);border-radius:8px;padding:8px 10px;"><button class="btn btn-sm" data-action="add-note" type="button">Add</button></div></div>' : "") +
          '<div class="modal-footer">' +
            '<div>' + (canDelete ? '<button class="btn btn-danger btn-sm" data-action="delete-task">Delete task</button>' : '') + '</div>' +
            '<div class="modal-footer-right"><button class="btn btn-ghost btn-sm" data-action="close-modal">Cancel</button>' + (canSave ? '<button class="btn btn-primary btn-sm" data-action="save-task">Save</button>' : '') + '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    updatePriorityPreview(initialEnd, initialStatus);
  }

  function updatePriorityPreview(endVal, statusVal){
    var badgeEl = document.getElementById("priority-preview-badge");
    if(!badgeEl) return;
    var endEl = document.getElementById("f-end");
    var statusEl = document.getElementById("f-status");
    var end = endVal != null ? endVal : (endEl ? endEl.value : todayISO());
    var status = statusVal != null ? statusVal : (statusEl ? statusEl.value : "Not Started");
    badgeEl.innerHTML = priorityBadge(computePriority({ endDate: end, status: status }));
  }

  function saveTaskFromModal(){
    var m = state.modal;
    var title = document.getElementById("f-title").value.trim();
    if(!title){ showToast("Give the task a title first."); return; }
    var status = document.getElementById("f-status").value;
    var startVal = document.getElementById("f-start").value || todayISO();
    var endVal = document.getElementById("f-end").value || startVal;
    if(endVal < startVal){ startVal = endVal; showToast("Start date adjusted to match the new end date."); }

    if(m.mode === "add"){
      var desc = document.getElementById("f-desc").value.trim();
      var category = document.getElementById("f-category").value;
      var sharedNotes = m.notes;

      if(ROLE === "employee"){
        state.tasks.push({
          id: uid("t"),
          title: title,
          description: desc,
          assigneeId: state.employeeViewer,
          category: category,
          status: status,
          startDate: startVal,
          endDate: endVal,
          createdDate: todayISO(),
          completedDate: status === "Completed" ? todayISO() : null,
          notes: sharedNotes.slice(),
          assignedBy: { type: "self", id: state.employeeViewer }
        });
        showToast("Task added.");
        closeModal();
        render();
        persist();
        return;
      }

      var assigneeSel = document.getElementById("f-assignees");
      var assigneeIds = assigneeSel ? Array.prototype.map.call(assigneeSel.selectedOptions, function(o){ return o.value; }) : [];
      if(!assigneeIds.length){ showToast("Pick at least one person to assign this to."); return; }
      var assignedBy = ROLE === "manager" ? { type:"manager", id: state.managerViewer } : { type:"admin", id:null };
      assigneeIds.forEach(function(assigneeId){
        state.tasks.push({
          id: uid("t"),
          title: title,
          description: desc,
          assigneeId: assigneeId,
          category: category,
          status: status,
          startDate: startVal,
          endDate: endVal,
          createdDate: todayISO(),
          completedDate: status === "Completed" ? todayISO() : null,
          notes: sharedNotes.slice(),
          assignedBy: assignedBy
        });
      });
      showToast(assigneeIds.length > 1 ? ("Task added for " + assigneeIds.length + " people.") : "Task added.");
    } else {
      var task = state.tasks.find(function(t){ return t.id === m.taskId; });
      if(!task) return;
      var savingSelfTask = isSelfAddedTask(task);
      if(canEditFully() || savingSelfTask){
        task.title = title;
        task.description = document.getElementById("f-desc").value.trim();
        if(canEditFully()){
          task.assigneeId = document.getElementById("f-assignee").value || null;
        }
        task.category = document.getElementById("f-category").value;
        task.startDate = startVal;
        task.endDate = endVal;
      }
      if(task.status !== "Completed" && status === "Completed") task.completedDate = todayISO();
      if(status !== "Completed") task.completedDate = null;
      task.status = status;
      task.notes = m.notes;
      showToast("Saved.");
    }
    closeModal();
    render();
    persist();
  }

  // ---------- event handling ----------
  function handleClick(e){
    var el = e.target.closest("[data-action]");
    if(!el) return;
    var action = el.getAttribute("data-action");

    if(action === "do-login"){ handleLoginSubmit(); return; }
    if(action === "select-login-name"){
      state.loginSelectedId = el.getAttribute("data-id");
      state.loginError = null;
      renderView();
      var pinEl = document.getElementById("login-pin");
      if(pinEl) pinEl.focus();
      return;
    }
    if(action === "logout"){ handleLogout(); return; }
    if(action === "open-task"){ openModal("edit", el.getAttribute("data-id")); return; }
    if(action === "open-add-task"){ openModal("add", null); return; }
    if(action === "close-modal" || action === "overlay-close"){
      if(action === "overlay-close" && e.target !== el) return;
      closeModal();
      return;
    }
    if(action === "save-task"){ saveTaskFromModal(); return; }
    if(action === "refresh"){ manualRefresh(); return; }
    if(action === "run-import"){
      var importTa = document.getElementById("import-text");
      var text = importTa ? importTa.value : "";
      if(!text || !text.trim()){ showToast("Paste some rows or choose a file first."); return; }
      var result = runImport(text);
      state.importResult = result;
      if(result.added || result.updated){
        render();
        persist();
      } else {
        renderView();
      }
      return;
    }
    if(action === "export-tasks"){
      exportTasksCSV(currentScopeTasks());
      showToast("Export downloaded.");
      return;
    }
    if(action === "download-template"){
      downloadImportTemplate();
      return;
    }
    if(action === "delete-selected"){
      var selIds = Object.keys(state.selectedIds).filter(function(id){ return state.selectedIds[id]; });
      if(!selIds.length) return;
      if(window.confirm("Delete " + selIds.length + " selected task(s)? This can't be undone.")){
        state.tasks = state.tasks.filter(function(t){ return selIds.indexOf(t.id) === -1; });
        state.selectedIds = {};
        render();
        persist();
        showToast(selIds.length + " task(s) deleted.");
      }
      return;
    }
    if(action === "filter-person"){
      state.filters.assignee = el.getAttribute("data-id");
      state.viewMode = "list";
      renderView();
      return;
    }
    if(action === "set-view"){ state.viewMode = el.getAttribute("data-mode"); renderView(); return; }
    if(action === "cal-prev" || action === "cal-next"){
      var delta = action === "cal-prev" ? -1 : 1;
      var mm = state.calendar.month + delta, yy = state.calendar.year;
      if(mm < 0){ mm = 11; yy--; } else if(mm > 11){ mm = 0; yy++; }
      state.calendar.month = mm; state.calendar.year = yy; state.calendar.selectedDay = null;
      renderView();
      return;
    }
    if(action === "month-prev" || action === "month-next"){
      var mdelta = action === "month-prev" ? -1 : 1;
      var mmm = state.monthReview.month + mdelta, myy = state.monthReview.year;
      if(mmm < 0){ mmm = 11; myy--; } else if(mmm > 11){ mmm = 0; myy++; }
      state.monthReview.month = mmm; state.monthReview.year = myy;
      renderView();
      return;
    }
    if(action === "month-current"){
      var tdm = todayDate();
      state.monthReview.month = tdm.getMonth(); state.monthReview.year = tdm.getFullYear();
      renderView();
      return;
    }
    if(action === "cal-today"){
      var td = todayDate();
      state.calendar.month = td.getMonth(); state.calendar.year = td.getFullYear(); state.calendar.selectedDay = todayISO();
      renderView();
      return;
    }
    if(action === "select-day"){
      var date = el.getAttribute("data-date");
      state.calendar.selectedDay = (state.calendar.selectedDay === date) ? null : date;
      renderView();
      return;
    }
    if(action === "delete-task"){
      if(window.confirm("Delete this task? This can't be undone.")){
        state.tasks = state.tasks.filter(function(t){ return t.id !== state.modal.taskId; });
        closeModal();
        render();
        persist();
        showToast("Task deleted.");
      }
      return;
    }
    if(action === "add-note"){
      var input = document.getElementById("f-note");
      var text = input.value.trim();
      if(!text) return;
      state.modal.notes.push({ text: text, date: todayISO() });
      input.value = "";
      renderModal();
      return;
    }
    if(action === "add-member"){
      var nameInput = document.getElementById("new-member-name");
      var name = nameInput.value.trim();
      if(!name) return;
      var isMgr = document.getElementById("new-member-manager").checked;
      var reportsToSel = document.getElementById("new-member-reports-to");
      var reportsTo = reportsToSel ? Array.prototype.map.call(reportsToSel.selectedOptions, function(o){ return o.value; }) : [];
      var pinInput = document.getElementById("new-member-pin");
      var newPin = (pinInput.value || "").replace(/[^0-9]/g, "").slice(0, 6) || randomPin();
      var deptSel = document.getElementById("new-member-department");
      var dept = deptSel ? deptSel.value : "Other";
      state.team.push({ id: uid("tm"), name: name, isManager: isMgr, managerIds: isMgr ? [] : reportsTo, pin: newPin, department: dept });
      render();
      persist();
      return;
    }
    if(action === "remove-member"){
      var id = el.getAttribute("data-id");
      state.team = state.team.filter(function(mem){ return mem.id !== id; });
      state.team.forEach(function(mem){ if(mem.managerIds) mem.managerIds = mem.managerIds.filter(function(x){ return x !== id; }); });
      state.tasks.forEach(function(t){ if(t.assigneeId === id) t.assigneeId = null; });
      render();
      persist();
      return;
    }
  }

  function handleChange(e){
    var t = e.target;
    if(t.matches("[data-filter]")){
      state.filters[t.getAttribute("data-filter")] = t.value;
      renderView();
      return;
    }
    if(t.matches("[data-action='toggle-select']")){
      var selId = t.getAttribute("data-id");
      if(t.checked) state.selectedIds[selId] = true; else delete state.selectedIds[selId];
      renderView();
      return;
    }
    if(t.id === "select-all-tasks"){
      var ids = state.lastVisibleIds || [];
      if(t.checked){ ids.forEach(function(id){ state.selectedIds[id] = true; }); }
      else { ids.forEach(function(id){ delete state.selectedIds[id]; }); }
      renderView();
      return;
    }
    if(t.id === "import-file" && t.files && t.files[0]){
      var reader = new FileReader();
      reader.onload = function(){
        var ta = document.getElementById("import-text");
        if(ta) ta.value = reader.result;
      };
      reader.readAsText(t.files[0]);
      return;
    }
    if(t.matches("[data-action='quick-status']")){
      var id = t.getAttribute("data-id");
      var task = state.tasks.find(function(x){ return x.id === id; });
      if(!task) return;
      if(task.status !== "Completed" && t.value === "Completed") task.completedDate = todayISO();
      if(t.value !== "Completed") task.completedDate = null;
      task.status = t.value;
      render();
      persist();
      return;
    }
    if(t.matches("[data-action='set-viewer']")){
      state.employeeViewer = t.value;
      renderView();
      return;
    }
    if(t.matches("[data-action='set-manager-viewer']")){
      state.managerViewer = t.value;
      state.filters = { assignee:"all", priority:"all", status:"all", category:"all" };
      renderView();
      return;
    }
    if(t.matches("[data-action='rename-member']")){
      var mid = t.getAttribute("data-id");
      var mem = getMember(mid);
      if(mem){ mem.name = t.value.trim() || mem.name; render(); persist(); }
      return;
    }
    if(t.matches("[data-action='toggle-manager']")){
      var mid2 = t.getAttribute("data-id");
      var mem2 = getMember(mid2);
      if(mem2){
        mem2.isManager = t.checked;
        if(mem2.isManager) mem2.managerIds = [];
        render();
        persist();
      }
      return;
    }
    if(t.matches("[data-action='set-reports-to']")){
      var mid3 = t.getAttribute("data-id");
      var mem3 = getMember(mid3);
      if(mem3){
        mem3.managerIds = Array.prototype.map.call(t.selectedOptions, function(o){ return o.value; });
        render(); persist();
      }
      return;
    }
    if(t.matches("[data-action='set-pin']")){
      var mid4 = t.getAttribute("data-id");
      var mem4 = getMember(mid4);
      var cleanPin = t.value.replace(/[^0-9]/g, "").slice(0, 6);
      if(mem4){ mem4.pin = cleanPin || "0000"; render(); persist(); }
      return;
    }
    if(t.matches("[data-action='set-department']")){
      var mid5 = t.getAttribute("data-id");
      var mem5 = getMember(mid5);
      if(mem5){ mem5.department = t.value; render(); persist(); }
      return;
    }
    if(t.id === "f-end" || t.id === "f-status"){ updatePriorityPreview(); return; }
  }

  function handleKeydown(e){
    if(e.key === "Enter" && e.target && e.target.id === "login-pin"){
      handleLoginSubmit();
    }
  }

  function showFatalError(msg){
    var el = document.getElementById("fatal-error-box");
    if(!el){
      el = document.createElement("div");
      el.id = "fatal-error-box";
      el.style.cssText = "position:fixed;top:10px;left:10px;right:10px;z-index:99999;background:#B5432E;color:#fff;padding:16px 18px;border-radius:10px;font-family:monospace;font-size:13px;white-space:pre-wrap;box-shadow:0 8px 24px rgba(0,0,0,0.35);max-height:60vh;overflow:auto;";
      document.body.appendChild(el);
    }
    el.textContent = "ERROR CAUGHT — screenshot this whole box and send it:\n\n" + msg;
  }
  function safeHandler(fn){
    return function(e){
      try{
        fn(e);
      }catch(err){
        showFatalError((err && err.message ? err.message : String(err)) + (err && err.stack ? "\n\n" + err.stack : ""));
      }
    };
  }
  document.body.addEventListener("click", safeHandler(handleClick));
  document.body.addEventListener("change", safeHandler(handleChange));
  document.body.addEventListener("keydown", safeHandler(handleKeydown));

  function render(){ renderView(); }

  document.addEventListener("DOMContentLoaded", loadData);
})();

</script>
</body>
</html>
